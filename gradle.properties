org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
# WINDOWS-ROOT above makes the JVM trust whatever root certs Windows already trusts,
# instead of only its own bundled cacerts. Fixes plugin/dependency resolution failing
# on a corporate machine that does TLS inspection (Zscaler/Netskope/etc.) with a root
# CA that's in the Windows trust store but wasn't in the JDK's. Remove this line if it
# turns out not to be needed, or once IT provisions the JDK's cacerts directly instead.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
