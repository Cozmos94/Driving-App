[versions]
# These are the latest stable versions known at the time this project was scaffolded
# (mid/late 2025). Per the spec, check for newer stable releases before you build —
# do not assume these are still current.
agp = "8.13.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.03"
room = "2.8.4"
maplibre = "11.5.2"
playServicesLocation = "21.3.0"
coroutines = "1.8.1"
navigationCompose = "2.9.8"
okhttp = "4.12.0"
# TomTom Navigation SDK -- confirmed live against docs.tomtom.com's current
# (post my.tomtom.com migration) project-setup page. Check
# docs.tomtom.com/navigation/android/getting-started/project-setup for a
# newer version before bumping blindly.
tomtomSdk = "2.4.2"
# The actual navigation-guidance engine (com.tomtom.sdk.navigation:*) is
# released on its own, completely independent version scheme from the rest of
# the SDK -- confirmed live by browsing repositories.tomtom.com's Artifactory
# listing directly (publicly browsable with no login). Pinning this to 2.4.2
# like everything else was a real bug, not a permissions issue: that version
# doesn't exist for this module family, and Artifactory returns 401 rather
# than 404 for a nonexistent version path here, which read exactly like an
# access-restriction error until checked directly. 1.26.8 is the latest
# available as of this check -- verify before bumping.
tomtomNavigationEngine = "1.26.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# TomTom Navigation SDK -- see version note above. Three artifacts confirmed
# from the current project-setup/quickstart docs: init (core SDK + TomTomSdk
# entry point), a location provider (simulation, for this spike -- swap for a
# real GPS-backed provider once past the spike stage), and the routing module
# (RoutePlanner, route reconstruction from supportingPoints).
tomtom-sdk-init = { group = "com.tomtom.sdk", name = "init", version.ref = "tomtomSdk" }
# buildSdkConfiguration()/SdkConfiguration -- confirmed via the real Dokka API
# reference that these live here, not as TomTomSdk members as first guessed;
# not pulled in transitively by init/routing/navigation, needs declaring
# explicitly. Confirmed anonymously downloadable at 2.4.2 directly against
# Artifactory, same version family as init/location/routing (not the
# independent navigation-engine scheme).
tomtom-sdk-common-configuration = { group = "com.tomtom.sdk.common", name = "configuration", version.ref = "tomtomSdk" }
tomtom-sdk-location-provider-simulation = { group = "com.tomtom.sdk.location", name = "provider-simulation", version.ref = "tomtomSdk" }
tomtom-sdk-routing-route-planner = { group = "com.tomtom.sdk.routing", name = "route-planner", version.ref = "tomtomSdk" }
# Not in the quickstart's own dependency list (a real gap in their docs --
# NavigationOptions/RoutePlan/TomTomNavigation, all under com.tomtom.sdk.navigation,
# were unresolved without it). Confirmed via Artifactory directly: AAR packaging,
# depends on navigation-engines-android/route-replanner-android/the online
# hazards-traffic-safety-location modules -- this is the real guidance engine,
# not navigation-online (wrong version scheme, see tomtomNavigationEngine's own
# comment) or navigation-android-complete (turned out to be a bundle of
# supporting services -- adas/hazards/traffic/vehicle/data-management -- not
# the engine itself).
tomtom-sdk-navigation-android = { group = "com.tomtom.sdk.navigation", name = "navigation-android", version.ref = "tomtomNavigationEngine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
