[versions]
# These are the latest stable versions known at the time this project was scaffolded
# (mid/late 2025). Per the spec, check for newer stable releases before you build —
# do not assume these are still current.
agp = "8.13.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.03"
room = "2.8.4"
maplibre = "11.5.2"
playServicesLocation = "21.3.0"
coroutines = "1.8.1"
navigationCompose = "2.9.8"
okhttp = "4.12.0"
# Confirmed current stable on Maven Central at the time of this change --
# check before bumping, same as every other version in this file.
coreSplashscreen = "1.2.0"
# TomTom Navigation SDK -- confirmed live against docs.tomtom.com's current
# (post my.tomtom.com migration) project-setup page. Check
# docs.tomtom.com/navigation/android/getting-started/project-setup for a
# newer version before bumping blindly.
tomtomSdk = "2.4.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# Lets MainActivity control the OS's own cold-start splash screen (API 31+ --
# pre-31 this compat library just applies postSplashScreenTheme immediately,
# no separate icon phase to worry about) instead of leaving it at Android's
# unconfigured default, which is what was rendering the small app-icon-on-
# white-background flash Corey doesn't want -- see themes.xml's
# Theme.LessonRoutes.Splash and MainActivity.kt's installSplashScreen() call.
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Real icon glyphs (recenter/close) for TomTomNavigationScreen.kt's nav-style
# buttons -- version comes from the same compose-bom platform already applied,
# same pattern as androidx-ui/androidx-material3 above. "-extended" (not
# "-core"), confirmed by a real compile error: Icons.Default.MyLocation is
# unresolved against material-icons-core, which only bundles a small ~50-icon
# common set -- MyLocation (and most icons beyond the most basic ones) only
# exists in the much larger extended set.
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# TomTom Navigation SDK -- see version note above. Three artifacts confirmed
# from the current project-setup/quickstart docs: init (core SDK + TomTomSdk
# entry point), a location provider (simulation, for this spike -- swap for a
# real GPS-backed provider once past the spike stage), and the routing module
# (RoutePlanner, route reconstruction from supportingPoints).
tomtom-sdk-init = { group = "com.tomtom.sdk", name = "init", version.ref = "tomtomSdk" }
# buildSdkConfiguration()/SdkConfiguration -- confirmed via the real Dokka API
# reference that these live here, not as TomTomSdk members as first guessed;
# not pulled in transitively by init/routing/navigation, needs declaring
# explicitly. Confirmed anonymously downloadable at 2.4.2 directly against
# Artifactory, same version family as init/location/routing (not the
# independent navigation-engine scheme).
tomtom-sdk-common-configuration = { group = "com.tomtom.sdk.common", name = "configuration", version.ref = "tomtomSdk" }
tomtom-sdk-location-provider-simulation = { group = "com.tomtom.sdk.location", name = "provider-simulation", version.ref = "tomtomSdk" }
tomtom-sdk-routing-route-planner = { group = "com.tomtom.sdk.routing", name = "route-planner", version.ref = "tomtomSdk" }
# Not in the quickstart's own dependency list (a real gap in their docs --
# NavigationOptions/RoutePlan/TomTomNavigation, all under com.tomtom.sdk.navigation,
# were unresolved without it). Went through two wrong guesses before this:
# navigation-online (a totally different, independent 0.x/1.x version scheme --
# pinning it to 2.4.2 doesn't exist and got a misleading 401, not 404) and
# navigation-android (a real artifact, but ALSO independently versioned --
# 1.26.8 was the latest -- which cascaded into a string of duplicate-class
# errors, one module family at a time, as its 1.26.8-era transitive deps
# collided with everything else's 2.4.2-era ones: sensoris, then
# drivingassistance-protobuf-internal, likely more). The plain "navigation"
# artifact (no -android suffix, same pattern as com.tomtom.sdk:init) DOES
# publish real 2.4.2 releases -- confirmed directly against Artifactory --
# unlike navigation-android, and its own POM depends only on other 2.4.2
# artifacts, so this should be the one release train, not two colliding ones.
tomtom-sdk-navigation = { group = "com.tomtom.sdk.navigation", name = "navigation", version.ref = "tomtomSdk" }
# REAL, GPS-backed location provider for actual on-device navigation --
# provider-simulation above is a fake GPS source, spike-only. Confirmed
# against TomTom's own current example app (github.com/tomtom-international/
# tomtom-example-app), which uses this exact artifact for the same purpose.
tomtom-sdk-location-provider-default = { group = "com.tomtom.sdk.location", name = "provider-default", version.ref = "tomtomSdk" }
# Real turn-by-turn map rendering + route/position visualization, Compose-
# native. First attempt at this used com.tomtom.sdk.navigation:ui-android-
# complete (NavigationFragment, a View/Fragment-based UI) -- confirmed live
# on-device that it renders its guidance chrome (maneuver banner etc.) but NO
# map at all, because that module has zero dependency on any map-rendering
# module and there's no documented way to attach one to it. Replaced with
# what TomTom's own current, actively-maintained example app actually uses
# (confirmed by reading its real source, not guessed): a Compose-native map
# (this artifact) + a route/position visualization layer (below), both driven
# by the same headless TomTomNavigation engine the original spike already
# proved works (TomTomSdk.navigation.start(NavigationOptions(routePlan))) --
# no Fragment, no FragmentActivity host, involved at all. Deliberately pinned
# to this project's existing 2.4.2 (not the example app's slightly newer
# 2.4.3) to stay on the one already-confirmed-compatible release train --
# mixing TomTom version families has caused real duplicate-class cascades in
# this project before (see tomtom-sdk-navigation's own comment above).
tomtom-sdk-maps-map-display-compose-standard = { group = "com.tomtom.sdk.maps", name = "map-display-compose-standard", version.ref = "tomtomSdk" }
tomtom-sdk-maps-visualization-compose = { group = "com.tomtom.sdk.maps.visualization", name = "visualization-compose", version.ref = "tomtomSdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
